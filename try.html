<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Try · Web AR Demos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="try">
  <a class="back" href="./">‹ All demos</a>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <img id="marker" alt="Artwork to scan" draggable="false" />
    </div>
  </div>

  <aside class="panel">
    <p class="eyebrow" id="tags"></p>
    <h1 id="title"></h1>
    <p class="en-title" id="en"></p>

    <div class="qr-box">
      <img id="qr" alt="Scan this QR code with your phone" />
      <a id="open" class="qr-link" target="_blank" rel="noopener"></a>
    </div>

    <ol class="steps" id="steps"></ol>

    <div class="spin" id="spin" hidden>
      <button class="btn" type="button" id="spin-btn">Pause</button>
      <label class="speed"><span>Slow</span><input id="speed" type="range" min="8" max="40" value="24" aria-label="Spin speed" /><span>Fast</span></label>
    </div>

    <p class="tips">Not tracking? Turn screen brightness up, hold your phone 30–50 cm away, and avoid glare on the screen.</p>

    <nav class="switch" id="switch" aria-label="Other demos"></nav>

    <p class="copyright">© <span id="year">2026</span> <a href="https://www.yinyinzhou.com" target="_blank" rel="noopener">Yinyin Zhou</a>. All rights reserved.</p>
  </aside>

  <script src="cases.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const cases = window.AR_CASES;
    const id = new URLSearchParams(location.search).get('case');
    const c = cases.find(x => x.id === id) || cases[0];
    const $ = s => document.getElementById(s);
    const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));

    document.title = 'Try · ' + c.title;
    $('stage').className = 'stage ' + c.shape;
    $('marker').src = c.marker;
    if (c.shape === 'envelope') {
      const env = document.createElement('div');
      env.className = 'red-envelope';
      env.innerHTML = '<div class="flap" aria-hidden="true"><span class="seal">福</span></div>';
      const img = $('marker');
      img.replaceWith(env);
      env.appendChild(img);
    }
    $('tags').textContent = c.tags.concat(c.sound ? ['Sound on'] : []).join(' · ');
    $('title').textContent = c.title;
    $('en').textContent = c.sub;
    $('qr').src = c.qr;
    $('open').href = c.url;
    $('open').textContent = c.url.replace(/^https:\/\//, '').replace(/\/$/, '');
    $('steps').innerHTML = c.steps.map(s => `<li>${esc(s)}</li>`).join('');
    $('switch').innerHTML = cases.filter(x => x.id !== c.id).map(x => `<a href="try.html?case=${x.id}">${esc(x.title)}</a>`).join('');

    if (c.spin) {
      $('spin').hidden = false;
      const marker = $('marker');
      const btn = $('spin-btn');
      const setSpeed = () => document.documentElement.style.setProperty('--spin-duration', (48 - Number($('speed').value)) + 's');
      setSpeed();
      $('speed').addEventListener('input', setSpeed);
      marker.classList.add('spinning');
      btn.textContent = 'Pause';
      btn.addEventListener('click', () => {
        const on = !marker.classList.contains('spinning') || marker.classList.contains('paused');
        if (!marker.classList.contains('spinning')) marker.classList.add('spinning');
        marker.classList.toggle('paused', !on);
        btn.textContent = on ? 'Pause' : 'Resume';
      });
    }
  </script>
</body>
</html>
